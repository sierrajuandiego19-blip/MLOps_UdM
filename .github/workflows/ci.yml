name: CI (uv)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Sync dependencies
        run: |
          uv --version
          uv sync --locked || uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .
        continue-on-error: true
      - name: Tests
        run: |
          uv run pytest -q || echo "No tests yet"
