# =============================================================================
# CI del proyecto, asumiendo que ESTA carpeta es la raíz del repositorio.
#
# El proyecto vive dentro del monorepo del curso, y GitHub Actions solo lee
# workflows de `.github/workflows/` en la raíz del repo. Por eso existen dos
# copias:
#
#   * esta — para cuando el proyecto se extrae a su propio repositorio
#     (`git init` en esta carpeta y push); es la configuración canónica.
#   * `<raíz del monorepo>/.github/workflows/project-mlops-ci.yml` — los mismos
#     jobs con `working-directory` apuntando aquí; es la que se ejecuta hoy.
#
# Ver docs/deployment.md.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias
        run: uv sync --all-groups --frozen

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Black (formato)
        run: uv run black --check src tests

  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias
        run: uv sync --all-groups --frozen

      # La suite corre sobre datos sintéticos: no descarga el dataset ni
      # necesita un modelo entrenado, así que son segundos y no minutos.
      - name: pytest con cobertura
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  pipeline-smoke:
    name: Smoke test del pipeline
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias
        run: uv sync --frozen

      # El repositorio versiona el estado de MLflow a propósito (ver
      # docs/compartir.md), con rutas ABSOLUTAS de la máquina donde se entrenó.
      # Este job comprueba la reproducibilidad desde cero, así que hay que
      # borrarlo: si se deja, MLflow intenta escribir en `/C:/Users/...` y en
      # Linux eso falla al crear un directorio en la raíz del sistema.
      - name: Partir de un estado limpio
        run: |
          rm -rf mlruns mlflow.db mlflow.db.bak
          rm -rf data/raw data/processed data/reference data/predictions
          rm -rf models/champion models/champion_metadata.json models/model_card.md
          rm -f reports/*.html reports/*.json

      # Entrena de verdad (descargando el dataset) pero sin tuning: verifica
      # que el pipeline completo funciona en una máquina limpia, que es
      # exactamente lo que hará quien evalúe el proyecto.
      - name: Pipeline de entrenamiento (sin tuning)
        env:
          BTD_TRAINING__CV_FOLDS: 3
        run: |
          uv run python -c "
          from src.pipelines.training_flow import training_pipeline
          result = training_pipeline(skip_tuning=True)
          assert result['status'] == 'success'
          assert result['test_metrics']['test_roc_auc'] > 0.70, 'el modelo no supera el piso de calidad'
          print('ROC-AUC:', result['test_metrics']['test_roc_auc'])
          "

      - name: Scoring batch sobre el modelo recién entrenado
        run: |
          uv run python -c "
          from src.pipelines.batch_scoring_flow import batch_scoring_pipeline
          result = batch_scoring_pipeline(n_rows=500)
          assert result['n_clients'] == 500
          print('Clientes puntuados:', result['n_clients'])
          "

      - name: Monitoreo (debe detectar el drift inyectado y no inventarlo)
        run: |
          uv run python -c "
          from src.pipelines.monitoring_flow import monitoring_pipeline
          stable = monitoring_pipeline(drift_strength=0.0, n_rows=1500)
          assert not stable['decision']['retrain_recommended'], 'falso positivo de drift'
          drifted = monitoring_pipeline(drift_strength=0.8, n_rows=1500)
          assert drifted['decision']['retrain_recommended'], 'el drift inyectado no se detecto'
          print('Monitoreo verificado en ambos escenarios')
          "

  # Verifica lo que recibe quien clona el repositorio: el estado de MLflow
  # versionado, reapuntado a esta máquina. Es el escenario real de la
  # evaluación por pares, y además cruza de sistema operativo (se versiona
  # desde Windows y aquí corre Ubuntu), que es donde estaban los bugs de rutas.
  shipped-state:
    name: El estado versionado funciona tras clonar
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Reapuntar el historial de MLflow a este runner
        run: uv run python scripts/relocate_mlflow.py

      - name: No deben quedar rutas de la maquina original ni URIs malformados
        run: |
          uv run python -c "
          import sqlite3
          con = sqlite3.connect('mlflow.db')
          cur = con.cursor()
          stale = malformed = 0
          for (table,) in cur.execute(\"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\"):
              for column in [r[1] for r in cur.execute(f'PRAGMA table_info({table})')]:
                  try:
                      stale += cur.execute(f'SELECT COUNT(*) FROM \"{table}\" WHERE \"{column}\" LIKE ?', ('%C:/Users/%',)).fetchone()[0]
                      malformed += cur.execute(f'SELECT COUNT(*) FROM \"{table}\" WHERE \"{column}\" LIKE ?', ('%file:////%',)).fetchone()[0]
                  except Exception:
                      pass
          print('rutas obsoletas:', stale, '| URIs malformados:', malformed)
          assert stale == 0, 'quedaron rutas de la maquina original'
          assert malformed == 0, 'quedaron URIs file:// malformados'
          "

      - name: El campeon carga del registry y predice el valor esperado
        run: |
          uv run python -c "
          import pandas as pd
          from src.models.registry import load_champion
          champion = load_champion(allow_local_fallback=False)
          print('campeon:', champion.name, 'v' + champion.version, 'umbral', round(champion.threshold, 2))
          assert champion.version == '1', 'el alias champion deberia apuntar a la v1'
          assert abs(champion.threshold - 0.42) < 0.01
          client = {'age': 62, 'job': 'retired', 'marital': 'married',
                    'education': 'university.degree', 'default': 'no', 'housing': 'no',
                    'loan': 'no', 'contact': 'cellular', 'month': 'mar',
                    'day_of_week': 'tue', 'campaign': 1, 'pdays': 3, 'previous': 2,
                    'poutcome': 'success', 'emp.var.rate': -1.8,
                    'cons.price.idx': 92.893, 'cons.conf.idx': -46.2,
                    'euribor3m': 1.313, 'nr.employed': 5099.1}
          probability = float(champion.model.predict_proba(pd.DataFrame([client]))[0][1])
          print('prediccion:', round(probability, 6))
          assert abs(probability - 0.623523) < 1e-6, 'el modelo versionado no predice lo mismo'
          "

      - name: El monitoreo corre sobre el estado versionado
        run: |
          uv run python -c "
          from src.pipelines.monitoring_flow import monitoring_pipeline
          result = monitoring_pipeline(drift_strength=0.8, n_rows=1500)
          assert result['decision']['retrain_recommended'], 'el drift inyectado no se detecto'
          print('monitoreo OK')
          "

  docker:
    name: Build de la imagen
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build de la imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bank-term-deposit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sin modelo registrado la API debe arrancar en modo `degraded`, no
      # caerse: es justamente el comportamiento que se quiere en producción.
      - name: Verificar que el contenedor arranca
        run: |
          docker run -d --name api-ci -p 8000:8000 bank-term-deposit-api:ci
          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "La API respondio tras ${attempt}s"
              curl -s http://localhost:8000/health
              docker rm -f api-ci
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondio en 40s"
          docker logs api-ci
          docker rm -f api-ci
          exit 1
